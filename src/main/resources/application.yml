spring:
  application:
    name: co-lending-control-tower

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/controltower}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# ── Actuator & Observability Configuration ────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,httpexchanges,env
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
    metrics:
      enabled: true
    httpexchanges:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

info:
  app:
    name: "Vivriti Co-Lending Control Tower"
    description: "Tripartite Financial Reconciliation & Control Engine"
    version: "1.0.0"
    architecture: "Deterministic 5-Tier Matcher with Zero-Tolerance Financial Close"
    financial-invariant: "Integer Paise (BIGINT) - Zero Float Drift"

# ── Control Tower Configuration ──────────────────────────────────────
controltower:
  generator:
    seed: 42
    loan-count: 2000
    business-days: 3
    cutoff-hour: 18
    cutoff-zone: UTC
    output-dir: ./data
    anomaly:
      overall-rate: 0.08
      missing-bank-leg-rate: 0.01
      missing-lms-leg-rate: 0.01
      duplicate-bank-event-rate: 0.008
      amount-mismatch-rate: 0.02
      status-mismatch-rate: 0.008
      timing-difference-rate: 0.015
      composite-split-rate: 0.008
      orphan-reversal-rate: 0.005
      schema-breach-rate: 0.005
      batch-total-mismatch-rate: 0.005

  reconciliation:
    rule-version: "1.0"
    grace-window-hours: 24
    probable-match-threshold: 0.82
    scoring-weights:
      amount-proximity: 0.40
      date-proximity: 0.25
      string-similarity: 0.35

  close:
    unresolved-exception-threshold-paise: 0

  exception:
    sla:
      amount-mismatch-hours: 4
      status-mismatch-hours: 2
      missing-feed-leg-hours: 12
      duplicate-callback-hours: 1
      orphan-reversal-hours: 4
      schema-breach-hours: 6
      control-total-mismatch-hours: 0

---
spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:controltower;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    locations: classpath:db/migration_h2

---
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/controltower_test}
    username: ${TEST_DB_USER:postgres}
    password: ${TEST_DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: false
    baseline-on-migrate: true

spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:h2:mem:controltower_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${TEST_DB_USER:sa}
    password: ${TEST_DB_PASSWORD:}
    driver-class-name: ${TEST_DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: true
    locations: classpath:db/migration_h2
    clean-disabled: false
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

controltower:
  generator:
    seed: 42
    loan-count: 1000
    business-days: 3
    cutoff-hour: 18
    cutoff-zone: UTC
    output-dir: ./data/test
    anomaly:
      overall-rate: 0.08
      missing-bank-leg-rate: 0.01
      missing-lms-leg-rate: 0.01
      duplicate-bank-event-rate: 0.008
      amount-mismatch-rate: 0.02
      status-mismatch-rate: 0.008
      timing-difference-rate: 0.015
      composite-split-rate: 0.008
      orphan-reversal-rate: 0.005
      schema-breach-rate: 0.005
      batch-total-mismatch-rate: 0.005

  reconciliation:
    rule-version: "1.0"
    grace-window-hours: 24
    probable-match-threshold: 0.82
    scoring-weights:
      amount-proximity: 0.40
      date-proximity: 0.25
      string-similarity: 0.35

  close:
    unresolved-exception-threshold-paise: 0

  exception:
    sla:
      amount-mismatch-hours: 4
      status-mismatch-hours: 2
      missing-feed-leg-hours: 12
      duplicate-callback-hours: 1
      orphan-reversal-hours: 4
      schema-breach-hours: 6
      control-total-mismatch-hours: 0
